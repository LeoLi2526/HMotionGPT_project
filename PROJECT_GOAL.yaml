# 项目目标的唯一参数入口。重大方向变更先改此文件，再同步下游方案。
schema_version: 1
revision: 8
updated_on: 2026-11-10
source:
  - 用户明确的低成本日常佩戴 EGO 数采、用于机器人 VLA 训练的目标
  - meetings/2026-11-02-kickoff/README.md（公开版任务摘要；原始纪要在私有存档）
  - 用户明确被试者已签署知情同意书，佩戴三设备并接入统一采集平台记录和存储数据的工作流
  - knowledge_base/devices/sichiray_n1_2026-11-05.md（臂环接收器串口初检）
  - 用户指认的思知瑞《8通道肌电臂环 1.0上位机教程》（硬件修订号仍待实物核验）
  - 用户提供的eRing硬件说明与BLE协议v2（knowledge_base/devices/ering.md；文档参数待实机核验）
  - 2026-11-09用户明确不再采用Nano，重新采购适配戒指和臂环的第一视角视觉模块
  - 2026-11-10用户明确允许各设备分别采集后对齐时间，不要求同一盒子接入三设备

north_star:
  application: robot_vla_training
  deliverable: 低负担、可日常佩戴的人类第一视角操作数据采集平台
  research_question: 三模态人类操作示范能否以可接受的采集成本，改善机器人 VLA 的真实操作学习？
  desired_outcome: 在固定机器人示范量与训练预算下，提高机器人闭环任务成功率或示范效率
  evidence_status: 目标与假设，尚无本项目机器人实验结论

data_path:
  source: 人类日常手物操作
  collection_workflow: 已签署知情同意书的被试者佩戴相机、戒指和前臂肌电臂环；采集平台管理会话、接入或导入设备原始流并保存证据
  recording_architecture: 允许各设备独立记录后导入同一会话；共用随身主机是可选实现，不是采购硬条件
  alignment_requirement: 保存各流原始时钟及采集代，按时钟段拟合偏移与漂移并以留出事件验证；同时启动或同为微秒单位不等于同步
  modalities:
    ring:
      signal: 手指运动 IMU
      device: 自制eRing（用户提供nRF54L15/ICM45686硬件说明和BLE v2协议）
      hardware_status: 文档定义50Hz六轴原值、设备单调微秒时钟和采集代；BLE与episode软件入口已离线联调，实物固件、输出、配对和同步精度待核实
    armband:
      signal: 前臂 8 通道 EMG
      auxiliary_signal: 前臂 6 轴惯性
      device: 思知瑞 8 通道肌电臂环，用户指认对应 1.0 上位机教程
      hardware_status: 已实测可读取 8/9/14 列文本流；硬件修订号、HEX 原始帧和设备时间戳仍待核实
    camera:
      signal: 第一视角 RGB 视频
      device: 待采购的第一视角RGB采集模块（已取消DJI Osmo Nano暂定选型）
      selection_status: 已取得锐尔威视SDK及AVI样片并静态核查微秒时间字段；离线时间解码未验证，厂商录像盒尚未开售或定价，整套便携方案待确认，未采购
      procurement_reference: knowledge_base/devices/vision_procurement_2026-11-09.md
      first_kit_budget_target_cny: 2000
      budget_scope: 首套视觉相机及必要采集主机、供电、存储和佩戴配件；优先控制在此金额内，不是已授权支付
      mobility_requirement: 允许有线连接随身采集盒，但被试必须能走动，不能依赖固定桌面电脑
  intermediate_product: 带原始流、时间映射、任务/事件标签、质量标记及来源的可重放 episode
  robot_action_supervision: 机器人自身轨迹、经验证的遥操作或经验证的跨本体映射

current_phase:
  name: 设备联调与小规模试采
  objective: 验证三流可导出、可同步、可重放，并能进入机器人 VLA 数据管线
  planned_evidence:
    - 三设备的原始样本、时间戳和失败日志
    - 采集平台的会话元数据、设备接入或导入记录、原始文件校验与重放记录
    - 至少 10 条完整三流 episode 的试采记录
    - 机器人及两项可复位任务的动作接口和示范来源
    - 成本、佩戴负担、数据可用率和同步误差的实测
  planning_status: N1 联调进行中；样本量、质量门槛和排期需试采后冻结

final_evaluation:
  primary_metric: 真实机器人闭环任务成功数/试次数及其置信区间
  secondary_metrics:
    - 固定成功率所需的机器人示范量
    - 每有效示范小时的设备和人工成本
    - 同步误差、可用 episode 比例、佩戴负担及跨物体/场景表现
  required_comparisons:
    - Robot-only
    - Robot + 人类 EGO-RGB
    - Robot + EGO-RGB + 戒指
    - Robot + EGO-RGB + 前臂 EMG
    - Robot + EGO-RGB + 戒指 + 前臂 EMG
  fairness_controls:
    - 固定机器人示范量和人类 episode 集合
    - 固定视觉主干、训练预算与测试任务

method_hypotheses:
  continuous_fusion: 独立编码器、时间窗口对齐、注意力融合是连续特征基线
  tokenization: HMotionGPT 式人类运动/肌电 token 化需与同预算连续融合比较
  token_status: 待检验；仅离线识别提高不足以成立为 VLA 贡献

change_rule:
  authority: 用户可以纠正或变更目标；agent 可自主优化实现路线和技能选择
  versioning: 每次重大变更前将旧版复制到 goal-history/，新版 revision 加 1
  sequence: 重大目标变更先修改本文件，再核对 AGENTS.md、实验方案、执行表和设备知识库
  reporting: 说明修改的字段、原因、受影响实验和仍未验证的主张
